[package]
name = "bastehyab"
version = "0.1.0"
description = "Local-first desktop application for Iranian mobile internet package discovery."
authors = ["BastehYab contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "bastehyab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tauri = { version = "2.8.0", features = [] }

[dev-dependencies]
